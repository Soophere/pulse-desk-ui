<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pulse Desk</title>
<link rel="stylesheet" href="/static/v3.css?v=10" />
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="rail-head">
      <div class="mark">PD</div>
      <div class="nm">Pulse Desk</div>
      <div class="ver" id="appVer"></div>
    </div>
    <nav class="rail-nav" id="railNav">
      <div class="sec">Overview</div>
      <div class="nav" data-page="home"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span><span class="lbl">Home</span></div>
      <div class="nav" data-page="testing"><span class="ic"><svg viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6A2 2 0 0 0 19 18l-5-9V3"/></svg></span><span class="lbl">Testing</span><span class="tag">paper</span></div>

      <div class="sec">Methods</div>
      <div class="nav" data-page="core"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12h8M12 8v8"/></svg></span><span class="lbl">Core bot</span><span class="led" id="led-core"></span></div>
      <div class="nav" data-page="wish"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 8l7-5 7 5"/></svg></span><span class="lbl">Wish Me Rich</span><span class="led" id="led-wish"></span></div>
      <div class="nav" data-page="moon"><span class="ic"><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg></span><span class="lbl">Moonshot</span><span class="led" id="led-moon"></span></div>
      <div class="nav" data-page="alpha"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v6h-6"/></svg></span><span class="lbl">On-chain Alpha</span><span class="led" id="led-alpha"></span></div>
      <div class="nav" data-page="follows"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M17 11l2 2 3-3"/></svg></span><span class="lbl">Follows</span><span class="tag">new</span></div>

      <div class="sec">Tools</div>
      <div class="nav" data-page="activity"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="2" cy="6" r=".6"/></svg></span><span class="lbl">Activity &amp; history</span></div>
      <div class="nav" data-page="council"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></span><span class="lbl">AI council</span><span class="led" id="led-council"></span></div>
      <div class="nav" data-page="exchanges"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></span><span class="lbl">Exchanges</span></div>
      <div class="nav" data-page="strategies"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></span><span class="lbl">Strategies</span></div>
      <div class="nav" data-page="rules"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v6c0 5-3.4 7.6-8 8-4.6-.4-8-3-8-8V7Z"/><path d="M9 12l2 2 4-4"/></svg></span><span class="lbl">Rules</span></div>
      <div class="nav" data-page="settings"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a7.9 7.9 0 0 0 .1-1 7.9 7.9 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a8 8 0 0 0-1.7-1L15 4.5h-4l-.4 2.6a8 8 0 0 0-1.7 1l-2.3-1-2 3.4L6.6 13a7.9 7.9 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a8 8 0 0 0 1.7 1l.4 2.6h4l.4-2.6a8 8 0 0 0 1.7-1l2.3 1 2-3.4Z"/></svg></span><span class="lbl">Settings</span></div>
    </nav>
    <div class="rail-foot">
      <div class="line"><span class="dot" id="fLinkDot"></span><span id="fLink">connecting</span></div>
      <div class="line"><span class="dot" id="fTokenDot"></span><span id="fToken">token</span></div>
    </div>
  </aside>

  <div class="main">
    <div class="banners">
      <div class="banner bad" id="offlineBanner" hidden>Dashboard offline — reconnecting…</div>
      <div class="banner" id="readyBanner" hidden></div>
    </div>
    <div class="topbar">
      <h1 id="ptitle">Home</h1>
      <div class="sub" id="psub">Everything at a glance</div>
    </div>
    <main class="page" id="p-home"></main>
    <main class="page" id="p-testing"></main>
    <main class="page" id="p-core"></main>
    <main class="page" id="p-wish"></main>
    <main class="page" id="p-moon"></main>
    <main class="page" id="p-alpha"></main>
    <main class="page" id="p-follows"></main>
    <main class="page" id="p-council"></main>
    <main class="page" id="p-exchanges"></main>
    <main class="page" id="p-strategies"></main>
    <main class="page" id="p-rules"></main>
    <main class="page" id="p-activity"></main>
    <main class="page" id="p-settings"></main>
  </div>
</div>

<div id="toast" hidden></div>
<div class="scrim" id="scrim"><div class="modal">
  <div class="mh"><h3 id="mTitle">—</h3><div class="sp"></div>
    <div class="seg" id="mTf"><button data-tf="15m">15m</button><button class="on" data-tf="1h">1h</button><button data-tf="4h">4h</button><button data-tf="1d">1d</button></div>
    <button class="btn sm" id="mClose">Close</button></div>
  <div class="mb" id="mBody"></div>
</div></div>

<script src="/static/v3-core.js?v=10"></script>
<script src="/static/v3-pages.js?v=10"></script>
<script>PD.boot();</script>
</body>
</html>
